name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files (skip source tooling and review images)
        run: |
          mkdir _site
          cp -r index.html m.html accessibility.html sitemap.xml llms.txt .nojekyll assets _site/
          # source material the page never loads (AI stills, raw transition clips): keep the upload small
          rm -rf _site/assets/media/stills _site/assets/media/transitions _site/assets/media/loops/src
          # full videos that live on the Kolbo CDN (assets/data/media-cdn.json) are not uploaded again
          node -e 'for (const p of Object.keys(require("./assets/data/media-cdn.json"))) require("fs").rmSync("_site/" + p, { force: true })'
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
