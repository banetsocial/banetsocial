<!doctype html>
<!-- The share card (WhatsApp / Facebook / LinkedIn preview). Render with tools/build-og.sh → assets/media/brand/og.jpg.
     Keep the important part in the middle: WhatsApp often crops the picture to a square. -->
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Heebo:wght@500;700&display=block" rel="stylesheet">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #061A22; }
.bg { position: absolute; inset: 0; background: url(../assets/media/rooms/exterior-1280.webp) center 38% / cover; }
.shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(4,16,22,.96) 0%, rgba(4,16,22,.82) 26%, rgba(4,16,22,0) 52%); }
.txt { position: absolute; inset-inline: 0; bottom: 34px; text-align: center; color: #fff; }
h1 { margin: 0; font: 800 68px/1.05 Rubik, sans-serif; letter-spacing: -.5px; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
h1 span { color: #4FE3F2; }
p { margin: 14px 0 0; font: 500 31px/1.2 Heebo, sans-serif; color: #D8F3F7; }
p b { color: #FFC66B; font-weight: 700; }
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="txt">
  <h1>וידאו שנראה כמו <span>קולנוע</span></h1>
  <p>רילס לעסקים · תיעוד אירועים · הפקות AI &nbsp;|&nbsp; <b>יוסי בנט</b></p>
</div>
</body></html>
